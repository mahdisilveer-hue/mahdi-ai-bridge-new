name: Build Mahdi AI Bridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. دریافت کدهای مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. خارج کردن پروژه Android از ZIP
      - name: Extract Android project
        run: |
          unzip -o MahdiAIBridge-Pro.zip
          test -f MahdiAIBridge-Pro/settings.gradle.kts
          test -f MahdiAIBridge-Pro/app/build.gradle.kts
          echo "Android project detected successfully."
          ls -la MahdiAIBridge-Pro

      # 3. نصب Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. نصب Android SDK و قرار دادن sdkmanager در PATH
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. نصب Android SDK مورد نیاز پروژه
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      # 6. نصب Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. بررسی Gradle و ساخت APK
      - name: Build Release APK
        working-directory: MahdiAIBridge-Pro
        run: |
          gradle --version
          gradle --no-daemon --stacktrace assembleRelease

      # 8. بررسی اینکه APK واقعاً ساخته شده
      - name: Verify APK
        working-directory: MahdiAIBridge-Pro
        run: |
          echo "Searching for generated APK..."
          find app/build/outputs/apk/release -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          echo "APK generated successfully."

      # 9. آپلود APK به عنوان Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahdi-AI-Bridge-Release
          path: MahdiAIBridge-Pro/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
